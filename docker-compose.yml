services:
  api:
    build: .
    container_name: floresta-api
    environment:
      PORT: 3000
      BACKEND_URL: http://host.docker.internal:4000
      ADMIN_API_KEY: dev-admin-key
      CORS_ORIGINS: "*"
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
